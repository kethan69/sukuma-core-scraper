name: Sukuma Core Cloud Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour
  workflow_dispatch:     # Allows manual triggering from GitHub UI

permissions:
  contents: write        # Grants permission to commit and push back to repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Scraper Engine
        run: python scraper.py

      - name: Execute Export Utility
        run: python export_utility.py

      - name: Commit and Push Updated Vault & Exports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Sukuma Core Bot"
          git config --global user.email "sukuma.core@proton.me"
          git add scraper_vault.db client_export.json client_export.csv || true
          git commit -m "chore(cloud): automated sync and data export [skip ci]" || echo "No changes to commit"
          git push origin master || git push origin HEAD:master
