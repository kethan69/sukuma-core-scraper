name: Sukuma Core Cloud Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour
  workflow_dispatch:     # Allows manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Scraper Engine
        run: python scraper.py

      - name: Execute Export Utility
        run: python export_utility.py

      - name: Commit and Push Updated Vault & Exports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Sukuma Core Bot"
          git config --global user.email "sukuma.core@proton.me"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Sync with remote branch safely
          git fetch origin master
          git rebase origin/master || true
          
          # Stage export files safely (ignore if missing)
          [ -f scraper_vault.db ] && git add scraper_vault.db
          [ -f client_export.json ] && git add client_export.json
          [ -f client_export.csv ] && git add client_export.csv
          
          # Exit cleanly if no changes were detected
          git diff --staged --quiet && echo "No changes to sync. Exiting successfully." && exit 0
          
          git commit -m "chore(cloud): automated sync and data export [skip ci]"
          git push origin HEAD:master
