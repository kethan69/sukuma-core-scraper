name: Sukuma Core Cloud Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Unified Pipeline Engine
        run: python pipeline.py

      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sukuma-extracted-data-${{ github.run_id }}
          path: |
            scraper_vault.db
            client_export.json
            client_export.csv
          retention-days: 30
